<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Mark de 3 hojas trazado con potrace directamente de portada.png (2026-07-14),
       las curvas son fieles al pixel del diseño original, no una aproximación a mano.
       Hoja grande recoloreada a crema (F0E6D2, era navy en portada.png) porque un
       navy sobre fondo navy sería invisible; las 2 hojas doradas mantienen el color
       exacto muestreado del original (CB9B64, distinto del gold de la app).
       Ronda 2: recorte de origen ampliado (la hoja pequeña quedaba cortada en el
       primer intento, de ahí su forma asimétrica) + máscaras por componentes
       conexas en vez de umbral de color puro + suavizado antes de trazar (quita
       el ruido de bordes del upscaling) + conjunto centrado en el cuadrado por
       el bounding box real, no a ojo.
       Ronda 3: fondo SIN esquinas redondeadas propias (antes rx=22) — con rx, las
       4 esquinas quedan transparentes, y iOS rellena esa transparencia con un
       color propio dependiente del tema (gris oscuro en dark mode, Roger 2026-07-14)
       antes de aplicar su recorte de esquinas. Cuadrado opaco de borde a borde =
       0 transparencia = 0 relleno del sistema; iOS/Android igual recortan
       esquinas redondeadas por su cuenta al mostrarlo. -->
