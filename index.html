<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="e3Foods — planificador de comidas familiares. Menús que piensan por ti, familias que comen mejor.">
<meta name="theme-color" content="#F5F0E8">
<title>e3Foods</title>

<!-- Instalable en pantalla de inicio (Roger 2026-07-14): iOS no permite auto-instalar
     al abrir el link (restricción de Apple, siempre Compartir -> "Añadir a inicio"),
     pero con esto el icono/lanzamiento quedan como una app real, no una captura fea. -->
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="e3Foods">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Lucide (Roger 2026-07-19, vía Claude Design): primera dependencia externa real del
     proyecto — versión FIJADA (no @latest, que el prototipo de Design sí usa) para no
     romper en producción si la librería cambia. -->
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="css/styles.css?v=74">
</head>
<body>

<!-- LANDING — cada carga. Tap "Empezar" -> wizard (si no hay familia) o HOY. -->
<div id="landing-screen" class="landing-screen">
  <img id="landing-hero-img" class="landing-hero" alt="e3Foods — menús que piensan por ti. Familias que comen mejor.">
  <script>
    // Rotación de portada por franja de 30 min (Roger 2026-07-17, evitar fatiga
    // visual entre aperturas — NO es una animación en vivo, se fija una vez por
    // carga). Sin src estático arriba a propósito: si el script corriera después
    // (p.ej. en app.js, cargado al final del body) el navegador ya habría
    // empezado a pedir la imagen equivocada. Inline y justo aquí = se fija antes
    // de que el navegador tenga ocasión de pintar nada. Epoch, no hora local:
    // sin líos de zona horaria, y de paso el cambio cae justo en :00/:30 en
    // cualquier huso. Las 3 comparten lienzo y geometría del hueco del CTA
    // (ver SPEC.md) — cambiar de slot no mueve el botón.
    // Por id, no document.currentScript.previousElementSibling (2026-07-17,
    // Roger vio el interrogante de imagen rota en su iPhone): más robusto entre
    // navegadores. onerror con fallback a portada-0 — si el slot calculado
    // fallara por lo que sea, nunca se queda sin foto.
    (function () {
      var img = document.getElementById('landing-hero-img');
      img.onerror = function () {
        if (img.src.indexOf('portada-0.jpg') === -1) img.src = 'assets/portada-0.jpg?v=60';
      };
      img.src = 'assets/portada-' + (Math.floor(Date.now() / 1800000) % 3) + '.jpg?v=60';
    })();
  </script>
  <button type="button" class="btn-primary landing-cta" data-action="empezar">Empezar</button>
</div>

<!-- WIZARD — alta conversacional en 3 pasos, una pregunta por pantalla:
     bienvenida (nombre de familia) -> hub (quién vive en casa) -> form (por persona) -->
<div id="wizard-screen" class="wizard-screen" hidden>

  <!-- PASO 1: saludo + "¿cómo os llamáis?" (nombre de familia) -->
  <div id="wizard-bienvenida" class="wizard-bienvenida"></div>

  <!-- PASO 2: "¿quién vive en casa de los X?" -->
  <div id="wizard-hub" class="wizard-hub" hidden></div>

  <!-- PASO 3: ficha de UNA persona — "solo te pido tres cosas" + detalles opcionales -->
  <div id="wizard-form" class="wizard-form-pantalla" hidden></div>

</div>

<!-- Banner de la vista de ejemplo (onboarding con familia demo, Roger 2026-07-16):
     visible solo mientras modoDemo=true en app.js; nunca se persiste ni sincroniza. -->
<div id="demo-banner" class="demo-banner" hidden>
  <span>Estás viendo un ejemplo — no es tu familia real.</span>
  <button type="button" class="demo-banner-btn" data-action="salir-demo">Crear mi menú</button>
</div>

<main id="vista-semana" class="vista" aria-label="Semana"></main>
<main id="vista-recetas" class="vista" hidden aria-label="Recetas"></main>
<main id="vista-descubrir" class="vista" hidden aria-label="Descubrir"></main>
<main id="vista-compra" class="vista" hidden aria-label="Compra"></main>
<main id="vista-perfil" class="vista" hidden aria-label="Familia"></main>
<main id="vista-receta" class="vista" hidden aria-label="Receta"></main>

<!-- Bottom sheet genérico: familia / compra / cambiar plato / elegir otro / nevera / confirmar regenerar -->
<div id="sheet-overlay" class="sheet-overlay" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div id="sheet-contenido"></div>
  </div>
</div>

<!-- Menú del hamburguesa: dropdown pequeño anclado al botón, no el sheet de
     abajo — reservado para listas de acciones cortas (Roger 2026-07-14) -->
<div id="menu-dropdown-overlay" class="menu-dropdown-overlay" hidden></div>
<div id="menu-dropdown" class="menu-dropdown" role="menu" hidden></div>

<nav class="bottom-nav" aria-label="Navegación principal">
  <button type="button" class="nav-btn active" data-action="ir-vista" data-vista="semana" aria-current="page"><span class="nav-ico"><i data-lucide="calendar-heart"></i></span><span class="nav-label">Semana</span></button>
  <button type="button" class="nav-btn" data-action="ir-vista" data-vista="recetas" aria-current="false"><span class="nav-ico"><i data-lucide="book-open"></i></span><span class="nav-label">Recetas</span></button>
  <button type="button" class="nav-btn" data-action="ir-vista" data-vista="descubrir" aria-current="false"><span class="nav-ico"><i data-lucide="compass"></i></span><span class="nav-label">Descubrir</span></button>
  <button type="button" class="nav-btn" data-action="ir-vista" data-vista="compra" aria-current="false"><span class="nav-ico"><i data-lucide="shopping-basket"></i></span><span class="nav-label">Compra</span></button>
  <button type="button" class="nav-btn" data-action="ir-vista" data-vista="perfil" aria-current="false"><span class="nav-ico"><i data-lucide="users"></i></span><span class="nav-label">Familia</span></button>
</nav>

<!-- Banco de recetas (82 plantillas + postres). Si no carga (404/sintaxis), app.js muestra
     un error visible en vez de arrancar degradado — no hay banco de respaldo. -->
<script src="data/recetas.js?v=74"></script>
<script src="js/engine.js?v=74"></script>
<script src="js/ui.js?v=74"></script>
<!-- Firebase compat (multiusuario, Roger 2026-07-14) — build "compat" a propósito:
     el resto del bundle son scripts planos sin módulos ES, esto evita reestructurar
     todo a type="module" solo por esto. -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-check-compat.js"></script>
<script src="js/sync.js?v=74"></script>
<script src="js/app.js?v=74"></script>
</body>
</html>
