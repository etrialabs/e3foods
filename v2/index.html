<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="e3Foods — planificador de comidas familiares. Menús que piensan por ti, familias que comen mejor.">
<meta name="theme-color" content="#F5F0E8">
<title>e3Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- LANDING — cada carga. Tap "Empezar" -> wizard (si no hay familia) o HOY. -->
<div id="landing-screen" class="landing-screen">
  <img class="landing-hero" src="assets/portada.png" alt="e3Foods — menús que piensan por ti. Familias que comen mejor.">
  <button type="button" class="btn-primary landing-cta" data-action="empezar">Empezar</button>
</div>

<!-- WIZARD — alta conversacional en 3 pasos, una pregunta por pantalla:
     bienvenida (nombre de familia) -> hub (quién vive en casa) -> form (por persona) -->
<div id="wizard-screen" class="wizard-screen" hidden>

  <!-- PASO 1: saludo + "¿cómo os llamáis?" (nombre de familia) -->
  <div id="wizard-bienvenida" class="wizard-bienvenida"></div>

  <!-- PASO 2: "¿quién vive en casa de los X?" -->
  <div id="wizard-hub" class="wizard-hub" hidden></div>

  <!-- PASO 3: ficha de UNA persona — "solo te pido tres cosas" + detalles opcionales -->
  <div id="wizard-form" class="wizard-form-pantalla" hidden></div>

</div>

<main id="vista-hoy" class="vista" aria-label="Hoy"></main>
<main id="vista-semana" class="vista" hidden aria-label="Semana"></main>
<main id="vista-recetas" class="vista" hidden aria-label="Recetas"></main>
<main id="vista-compra" class="vista" hidden aria-label="Compra"></main>

<!-- Bottom sheet genérico: familia / compra / cambiar plato / elegir otro / nevera / confirmar regenerar -->
<div id="sheet-overlay" class="sheet-overlay" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true">
    <div id="sheet-contenido"></div>
  </div>
</div>

<nav class="bottom-nav" aria-label="Navegación principal">
  <button type="button" class="nav-btn active" data-action="ir-vista" data-vista="hoy" aria-current="page"><span class="nav-label">Hoy</span><span class="nav-dot"></span></button>
  <button type="button" class="nav-btn" data-action="ir-vista" data-vista="semana" aria-current="false"><span class="nav-label">Semana</span><span class="nav-dot"></span></button>
  <button type="button" class="nav-btn" data-action="ir-vista" data-vista="recetas" aria-current="false"><span class="nav-label">Recetas</span><span class="nav-dot"></span></button>
  <button type="button" class="nav-btn" data-action="ir-vista" data-vista="compra" aria-current="false"><span class="nav-label">Compra</span><span class="nav-dot"></span></button>
</nav>

<!-- data/recetas.js lo genera otro agente en paralelo. Si no existe (404), app.js usa un
     mini-banco DEV interno como fallback — ver comentario "DEV FALLBACK" en js/app.js. -->
<script src="data/recetas.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
